{% load i18n %}
<script>
    Swal.fire({
        title: gettext("{{ title }}"),
        text: gettext("{{ text }}"),
        icon: "{{ icon }}",
        showConfirmButton: false,
        timer: 3500,
        timerProgressBar: true,
        didClose: () => {
            location.reload();
        },
    });
</script>
